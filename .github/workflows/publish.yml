name: Publish to npm

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Check if version changed
        id: version-check
        run: |
          PREV_VERSION=$(git show HEAD~1:package.json 2>/dev/null | node -pe "JSON.parse(require('fs').readFileSync(0, 'utf8')).version" || echo "")
          CURR_VERSION=$(node -p "require('./package.json').version")
          echo "current=$CURR_VERSION" >> "$GITHUB_OUTPUT"
          if [ "$PREV_VERSION" = "$CURR_VERSION" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.version-check.outputs.skip == 'false'
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        if: steps.version-check.outputs.skip == 'false'

      - name: Install dependencies
        if: steps.version-check.outputs.skip == 'false'
        run: npm ci

      - name: Type check
        if: steps.version-check.outputs.skip == 'false'
        run: npm run typecheck

      - name: Run tests
        if: steps.version-check.outputs.skip == 'false'
        run: npm test

      - name: Publish to npm
        if: steps.version-check.outputs.skip == 'false'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
