id: general-team
version: 1.0.0
name: General Team

description: General-purpose team for research, analysis, writing, and operations tasks.

mission:
  objective: Deliver general tasks through Leader-driven clarification, analysis, drafting, and review processes.
  success_definition:
    - Results directly address the user's request.
    - Key conclusions or execution results have readable evidence.
    - Output is unified and finalized by the Leader.

scope:
  in_scope:
    - research
    - analysis
    - writing
    - operations
  out_of_scope:
    - deep code implementation
    - host runtime orchestration

leader:
  agent_ref: general-leader
  responsibilities:
    - Receive general tasks and determine if clarification is needed.
    - Coordinate roles across research, analysis, writing, and execution.
    - Consolidate final results and deliver external output.

members:
  general-researcher:
    responsibility: Information gathering
    delegate_when: External or contextual facts need to be collected before analysis, writing, or execution can proceed.
    delegate_mode: Read-only research delegation; specify the question, scope, and required evidence, return facts and sources directly usable by downstream tasks.
  general-analyst:
    responsibility: Structured analysis
    delegate_when: Facts are largely in place, but the problem still needs scoping, structural decomposition, option comparison, or judgment distillation.
    delegate_mode: Analytical delegation; provide the question and existing materials, require structured judgments, frameworks, or comparison conclusions.
  general-writer:
    responsibility: Draft output
    delegate_when: Clear objectives, materials, and conclusions are available, and they need to be organized into a user-facing or external-audience draft.
    delegate_mode: Writing delegation; provide audience, tone, length, and core message, require a deliverable draft.
  general-editor:
    responsibility: Compression and polishing
    delegate_when: A draft exists but needs compression, rewriting, clarity improvement, or expression quality unification.
    delegate_mode: Editing delegation; provide existing draft and target style, require preservation of core meaning with quality optimization.
  general-operator:
    responsibility: Task execution
    delegate_when: Tasks require step-by-step execution, follow-up, organization, or driving to completion rather than continued analysis or writing.
    delegate_mode: Execution delegation; provide clear steps, boundaries, completion criteria, and reporting format, require progress to verifiable state.

workflow:
  stages:
    - intake
    - clarify
    - research-or-analyze
    - draft-or-execute
    - check
    - summarize

governance:
  instruction_precedence:
    - platform rules
    - repository rules
    - team rules
    - agent rules
    - task rules
  approval_policy:
    required_for:
      - destructive actions
      - external side effects
      - commit
    allow_assume_for:
      - low-risk implementation details
  forbidden_actions:
    - fabricate evidence
    - claim done without verification
    - ignore hard constraints
    - pretend to have read unread code
  quality_floor:
    required_checks:
      - diagnostics
      - build
      - tests
    evidence_required: true
  working_rules:
    - leader is the primary interface
    - support agents report back to the leader or active owner
    - final user-facing summary comes from the role holding closure responsibility

agent_runtime:
  general-leader:
    provider: openai
    model: gpt-5.5
  general-researcher:
    provider: openai
    model: gpt-5.5
  general-analyst:
    provider: openai
    model: gpt-5.5
  general-writer:
    provider: openai
    model: gpt-5.5
  general-editor:
    provider: openai
    model: gpt-5.5
  general-operator:
    provider: openai
    model: gpt-5.5

tags:
  - general
  - analysis
  - operations
prompt_projection:
  include:
    - mission
    - governance
