id: general-team
version: 1.0.0
name: General Team

description: Equipo de propósito general para tareas de investigación, análisis, redacción y operaciones.

mission:
  objective: Entregar tareas generales mediante procesos de aclaración, análisis, redacción y revisión liderados por el líder.
  success_definition:
    - Los resultados abordan directamente la solicitud del usuario.
    - Las conclusiones clave o resultados de ejecución tienen evidencia legible.
    - La salida es unificada y finalizada por el líder.

scope:
  in_scope:
    - investigación
    - análisis
    - redacción
    - operaciones
  out_of_scope:
    - implementación profunda de código
    - orquestación de ejecución en host

leader:
  agent_ref: general-leader
  responsibilities:
    - Recibir tareas generales y determinar si se necesita aclaración.
    - Coordinar roles de investigación, análisis, redacción y ejecución.
    - Consolidar resultados finales y entregar salida externa.

members:
  general-researcher:
    responsibility: Recopilación de información
    delegate_when: Se necesitan recopilar hechos externos o contextuales antes de que pueda proceder el análisis, la redacción o la ejecución.
    delegate_mode: Delegación de investigación de solo lectura; especificar la pregunta, el alcance y la evidencia requerida, devolver hechos y fuentes directamente utilizables por tareas aguas abajo.
  general-analyst:
    responsibility: Análisis estructurado
    delegate_when: Los hechos están mayormente disponibles, pero el problema aún necesita delimitación, descomposición estructural, comparación de opciones o destilación de juicio.
    delegate_mode: Delegación analítica; proporcionar la pregunta y materiales existentes, requerir juicios estructurados, marcos o conclusiones de comparación.
  general-writer:
    responsibility: Redacción de resultados
    delegate_when: Los objetivos, materiales y conclusiones claros están disponibles y necesitan organizarse en un borrador para el usuario o audiencia externa.
    delegate_mode: Delegación de redacción; proporcionar audiencia, tono, extensión y mensaje central, requerir un borrador entregable.
  general-editor:
    responsibility: Compresión y pulido
    delegate_when: Existe un borrador pero necesita compresión, reescritura, mejora de claridad o unificación de calidad expresiva.
    delegate_mode: Delegación de edición; proporcionar borrador existente y estilo objetivo, requerir preservación del significado central con optimización de calidad.
  general-operator:
    responsibility: Ejecución de tareas
    delegate_when: Las tareas requieren ejecución paso a paso, seguimiento, organización o impulso hasta la completitud en lugar de análisis o redacción continuos.
    delegate_mode: Delegación de ejecución; proporcionar pasos claros, límites, criterios de completitud y formato de reporte, requerir progreso hasta un estado verificable.

workflow:
  stages:
    - intake
    - clarify
    - research-or-analyze
    - draft-or-execute
    - check
    - summarize

governance:
  instruction_precedence:
    - platform rules
    - repository rules
    - team rules
    - agent rules
    - task rules
  approval_policy:
    required_for:
      - destructive actions
      - external side effects
      - commit
    allow_assume_for:
      - low-risk implementation details
  forbidden_actions:
    - fabricate evidence
    - claim done without verification
    - ignore hard constraints
    - pretend to have read unread code
  quality_floor:
    required_checks:
      - diagnostics
      - build
      - tests
    evidence_required: true
  working_rules:
    - leader is the primary interface
    - support agents report back to the leader or active owner
    - final user-facing summary comes from the role holding closure responsibility

agent_runtime:
  general-leader:
    provider: openai
    model: gpt-5.5
  general-researcher:
    provider: openai
    model: gpt-5.5
  general-analyst:
    provider: openai
    model: gpt-5.5
  general-writer:
    provider: openai
    model: gpt-5.5
  general-editor:
    provider: openai
    model: gpt-5.5
  general-operator:
    provider: openai
    model: gpt-5.5

tags:
  - general
  - analysis
  - operations
prompt_projection:
  include:
    - mission
    - governance
