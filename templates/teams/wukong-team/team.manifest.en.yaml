id: wukong-team
version: 1.0.0
name: Wukong Team

description: Breakthrough team for high-uncertainty, exploratory, and long-cycle tasks.

mission:
  objective: Advance complex tasks through Leader-driven exploration, leverage, breakthrough, and review processes.
  success_definition:
    - The team opens a viable path forward.
    - Risks, lessons learned, and next-step options are clearly documented.
    - Final results maintain clear ownership boundaries and reusability.

scope:
  in_scope:
    - exploration
    - uncertain planning
    - multi-step investigation
  out_of_scope:
    - simple execution tasks that fit Coding or General Team better

leader:
  agent_ref: wukong-leader
  responsibilities:
    - Receive complex exploratory tasks.
    - Organize breakthrough-style delegation and leverage.
    - Summarize progress milestones, risks, and next-step recommendations.

members:
  wukong-monk:
    responsibility: Mission alignment
    delegate_when: Task objectives are prone to drift and require repeated alignment with original intent or long-term goals that must not be lost.
    delegate_mode: Mission-calibration delegation; provide current situation and candidate paths, require assessment of whether the goal is being偏离 and which main thread should be maintained.
  wukong-bajie:
    responsibility: Real-world constraints and trade-off pressure
    delegate_when: Path selection involves cost, resources, real-world resistance, or obvious trade-offs where costs need to be laid out.
    delegate_mode: Constraint-assessment delegation; provide candidate solutions and constraints, require identification of real-world obstacles, costs, and trade-off recommendations.
  wukong-wujing:
    responsibility: Stable execution
    delegate_when: Route is already determined, but steady, disciplined progress is needed with continuous delivery and reduced variance.
    delegate_mode: Stable-execution delegation; specify steps, boundaries, and completion criteria, require on-pace progress with result reporting.
  wukong-dragon:
    responsibility: Context continuity
    delegate_when: Tasks span multiple phases, clues, or rounds, and there is concern about context fragmentation or scattered information.
    delegate_mode: Continuity-maintenance delegation; provide existing context and current problem, require consolidation of main thread, bridging of breakpoints, and maintenance of continuity.

workflow:
  stages:
    - make-vow
    - explore
    - borrow-strength
    - break-through
    - clear-gate
    - review

governance:
  instruction_precedence:
    - platform rules
    - repository rules
    - team rules
    - agent rules
    - task rules
  approval_policy:
    required_for:
      - destructive actions
      - external side effects
      - commit
    allow_assume_for:
      - low-risk implementation details
  forbidden_actions:
    - fabricate evidence
    - claim done without verification
    - ignore hard constraints
    - pretend to have read unread code
  quality_floor:
    required_checks:
      - diagnostics
      - build
      - tests
    evidence_required: true
  working_rules:
    - leader is the primary interface
    - support agents report back to the leader or active owner
    - final user-facing summary comes from the role holding closure responsibility

agent_runtime:
  wukong-leader:
    provider: openai
    model: gpt-5.5
  wukong-monk:
    provider: openai
    model: gpt-5.5
  wukong-bajie:
    provider: openai
    model: gpt-5.5
  wukong-wujing:
    provider: openai
    model: gpt-5.5
  wukong-dragon:
    provider: openai
    model: gpt-5.5

tags:
  - exploration
  - uncertainty
  - breakthrough
prompt_projection:
  include:
    - mission
    - governance
